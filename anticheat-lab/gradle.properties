org.gradle.jvmargs=-Xmx2G
org.gradle.configuration-cache=false

# Fabric / Minecraft
# Matches MeteorDevelopment/meteor-addon-template at its "1.21.11 update" commit (6b0dbef).
# To target another 1.21.x, copy the versions from the template commit for that release
# and change the fabric-loom plugin version in build.gradle to match.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.3
loader_version=0.18.2

# Mod
mod_version=0.1.0
maven_group=com.anticheatlab
archives_base_name=anticheat-lab

# Dependencies
# Meteor publishes one snapshot per supported MC version: <mc_version>-SNAPSHOT
meteor_version=1.21.11-SNAPSHOT
junit_version=5.11.4
