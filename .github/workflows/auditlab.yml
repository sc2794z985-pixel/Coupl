name: Build AuditLab

on:
  push:
    branches: [claude/anticheat-lab-phase-1-xwz5wy]
    paths: ["auditlab/**", ".github/workflows/auditlab.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: auditlab-1.21.11
          path: auditlab/build/libs/*.jar
          if-no-files-found: error
